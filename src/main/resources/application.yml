spring:
  server:
    max-http-request-size: 25MB
  application:
    name: @project.name@
  output:
    ansi.enabled: always
  data:
    mongodb:
      auto-index-creation: true
  logging:
    level:
      root: INFO
      org.springframework.web.reactive.function.client: WARN

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
  swagger-ui.path: /docs

app:
  version: @project.version@
  name: @project.name@
  tmp-assets-dir: "./assets_tmp"
  assets-dir: "./assets"
  thumbnails:
    quality: 0.80
    format: jpg
  geocoding:
    enabled: true
    provider-url: https://nominatim.openstreetmap.org/reverse
    user-agent: "vehicle-collector-service/@project.version@"
    language: pl
    rate-limit-per-second: 1
    cache-precision: 3
    timeout-ms: 5000
    max-retries: 2
    retry-backoff-ms: 2000
    cache-max-entries: 10000
  security:
    swagger-public: false
    swagger-url: https://api.lan

keycloak:
  admin:
    baseUrl: http://localhost:8085
    realm: "vehicle"
    client-id: "someId"
    client-secret: "key"
    regular-user-role-id: "roleId"
    regular-user-role-name: "REGULAR_USER"
    frontend-client-id: "profiler-fe"
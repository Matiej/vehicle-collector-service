spring:
  security:
    oauth2:
      client:
        registration:
          keycloak:
            provider: keycloak
            client-id: ${app.web.auth.client-id}
            client-secret: ${app.web.auth.client-secret}
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            scope: openid,profile,email
        provider:
          keycloak:
            authorization-uri: ${app.web.auth.keycloak-public-url}/realms/${app.web.auth.realm}/protocol/openid-connect/auth
            token-uri: ${app.web.auth.keycloak-internal-url}/realms/${app.web.auth.realm}/protocol/openid-connect/token
            jwk-set-uri: ${app.web.auth.keycloak-internal-url}/realms/${app.web.auth.realm}/protocol/openid-connect/certs
            user-name-attribute: sub
  server:
    max-http-request-size: 25MB
  application:
    name: @project.name@
  output:
    ansi.enabled: always
  data:
    mongodb:
      auto-index-creation: true
  logging:
    level:
      root: INFO
      org.springframework.web.reactive.function.client: WARN

server:
  reactive:
    session:
      cookie:
        http-only: true
        secure: true
        same-site: lax

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
  swagger-ui.path: /docs

app:
  version: @project.version@
  name: @project.name@
  tmp-assets-dir: "./assets_tmp"
  assets-dir: "./assets"
  thumbnails:
    quality: 0.80
    format: jpg
  geocoding:
    enabled: true
    provider-url: https://nominatim.openstreetmap.org/reverse
    user-agent: "vehicle-collector-service/@project.version@"
    language: en
    rate-limit-per-second: 1
    cache-precision: 3
    timeout-ms: 5000
    max-retries: 2
    retry-backoff-ms: 2000
    cache-max-entries: 10000
  security:
    swagger-public: false
    swagger-url: https://api.lan
    web-panel-permit-all: false
  web:
    owner-filter: true
    auth:
      panel-url: http://localhost:5173
      keycloak-public-url: http://localhost:8085
      keycloak-internal-url: ${app.web.auth.keycloak-public-url}
      realm: vehicle
      client-id: vehicle-web-bff
      client-secret: configure-outside-repo

keycloak:
  admin:
    baseUrl: http://localhost:8085
    realm: "vehicle"
    client-id: "someId"
    client-secret: "key"
    regular-user-role-id: "roleId"
    regular-user-role-name: "REGULAR_USER"
    frontend-client-id: "profiler-fe"